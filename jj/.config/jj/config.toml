#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Daniel"
email = "dghaehre@gmail.com"

[aliases]
# It updates the closest bookmark ancestor to point to the current revision, giving me an easy command to type before I jj git push
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]
# updates the bookmark to the previous revision, while tug updates it to the current one. It’s useful to have both versions, since you might be working on the current revision, and so don’t want to push it just yet.
tug- = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]

mine = ["bookmark", "list", "-r", "mine()"]

# Fetch, then restack outstanding mutable branches (including their descendants).
# Based on https://github.com/jj-vcs/jj/discussions/8484.
sync-main = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
case "${1-}" in
  -h|--help)
    printf '%s\n' 'Usage: jj sync-main [--skip-emptied]' \
      'Fetch configured remotes and rebase outstanding mutable branch roots onto trunk().' \
      'With --skip-emptied, abandon changes that become empty during the rebase.'
    exit 0
    ;;
esac
if (( $# > 1 )) || { (( $# == 1 )) && [[ "$1" != --skip-emptied ]]; }; then
  printf '%s\n' 'Usage: jj sync-main [--skip-emptied]' >&2
  exit 2
fi

# util exec exposes this so jj -R <repo> sync-main works from any directory.
cd "$JJ_WORKSPACE_ROOT"
check_trunk() {
  trunk=$(jj log --no-graph -r 'trunk()' -T 'commit_id ++ "\n"')
  if [[ -z "$trunk" || "$trunk" == *$'\n'* || "$trunk" != *[!0]* ]]; then
    printf '%s\n' 'sync-main: trunk() must resolve to exactly one non-root commit; configure it for this repository.' >&2
    exit 1
  fi
}
check_trunk
jj git fetch
check_trunk

# Resolve after fetching, since trunk and already-landed changes may have moved.
sources="roots($trunk..) & mutable()"
roots=$(jj log --no-graph -r "$sources" -T 'commit_id ++ "\n"')
if [[ -n "$roots" ]]; then
  jj rebase --source "$sources" --onto "$trunk" "$@"
else
  printf '%s\n' 'No outstanding mutable branch roots to rebase.'
fi

# A successful jj rebase can still leave conflicts. Show all remaining mutable
# conflicts, including any pre-existing ones, rather than claiming a clean sync.
conflicts=$(jj log --no-graph -r 'mutable() & conflicts()' \
  -T 'change_id.short() ++ " " ++ description.first_line() ++ "\n"')
if [[ -n "$conflicts" ]]; then
  printf '\n%s\n%s\n' 'Sync completed, but unresolved conflicts remain in these mutable changes:' "$conflicts" >&2
  exit 1
fi
printf '%s\n' 'Synced outstanding mutable branches onto trunk().'
''', "jj-sync-main"]

[ui]
pager = ":builtin"
default-command = "log"
merge-editor = ":builtin"
# diff-editor = ":builtin"
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]
# hunk.nvim renders the diff itself, so the JJ-INSTRUCTIONS file is just noise.
diff-instructions = false
# diff-formatter = ":git"


[revset-aliases]
'bases' = 'dev'
'downstream(x,y)' = '(x::y) & y'
'branches' = 'downstream(trunk(), bookmarks()) & mine()'
'branchesandheads' = 'branches | (heads(trunk()::) & mine())'
'curbranch' = 'latest(branches::@- & branches)'
'nextbranch' = 'roots(@:: & branchesandheads)'

# [revsets]
# log = "@ | bases | branches | curbranch::@ | @::nextbranch | downstream(@, branchesandheads)"

[colors]
"diff header" = "yellow"
"diff empty" = "cyan"
"diff binary" = "cyan"
"diff file_header" = { bold = true }
"diff hunk_header" = "cyan"
"diff removed" = { fg = "red", underline = false }
"diff added" = { fg = "green", underline = false }
"diff token" = { underline = false }
"diff modified" = "cyan"
"diff untracked" = "magenta"
"diff renamed" = "cyan"
"diff copied" = "green"
"diff access-denied" = { bg = "red" }

